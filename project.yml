name: ComprasTecsup
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  ComprasTecsup:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.tecsup.grupob.compras
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Compras
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ComprasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ComprasTecsup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.tecsup.grupob.compras.tests
        GENERATE_INFOPLIST_FILE: YES
  ComprasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ComprasTecsup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.tecsup.grupob.compras.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ComprasTecsup:
    build:
      targets:
        ComprasTecsup: all
    test:
      targets: [ComprasTests, ComprasUITests]
